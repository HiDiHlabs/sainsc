[package]
name         = "_utils_rust"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.89.0"

[lib]
name       = "_utils_rust"
crate-type = ["cdylib"]

[dependencies]
bincode       = { version = "1.3" }
indexmap      = { version = ">= 2.1", features = ["rayon"] }
itertools     = { version = "0.13" }
ndarray       = { version = "0.16", features = ["rayon"] }
ndarray-stats = { version = "0.6" }
num           = { version = "0.4.1" }
numpy         = { version = "0.27" }
polars        = { version = "0.53", features = ["partition_by", "dtype-categorical"] }
polars-arrow  = { version = "0.53" }
pyo3          = { version = "0.27", features = ["extension-module"] }
pyo3-polars   = { version = "0.26", features = ["dtype-categorical"] }
rayon         = { version = "1.8" }
sprs          = { version = "0.11.2", features = ["serde"] }
